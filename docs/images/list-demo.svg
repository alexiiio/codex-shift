<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">Codex Shift interactive account list</title>
  <description id="description">An illustrative terminal showing two saved Codex profiles with account, plan, weekly usage, reset time, and live data source.</description>
  <rect width="1120" height="360" rx="18" fill="#101418"/>
  <rect width="1120" height="48" rx="18" fill="#1b2229"/>
  <rect y="30" width="1120" height="18" fill="#1b2229"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="24" r="7" fill="#febc2e"/>
  <circle cx="76" cy="24" r="7" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="34" y="84" fill="#f5f7fa" font-weight="700">Codex Shift</text>
    <text x="34" y="116" fill="#8f9aa6">2 profiles · Choose an account</text>
    <text x="72" y="166" fill="#8f9aa6">NAME</text>
    <text x="230" y="166" fill="#8f9aa6">ACCOUNT</text>
    <text x="512" y="166" fill="#8f9aa6">PLAN</text>
    <text x="620" y="166" fill="#8f9aa6">WEEK LEFT</text>
    <text x="768" y="166" fill="#8f9aa6">RESET TIME</text>
    <text x="970" y="166" fill="#8f9aa6">SOURCE</text>
    <text x="34" y="208" fill="#46c9d6" font-weight="700">›</text>
    <text x="54" y="208" fill="#43d17c" font-weight="700">*</text>
    <text x="72" y="208" fill="#46c9d6" font-weight="700">personal</text>
    <text x="230" y="208" fill="#f5f7fa">personal@example.com</text>
    <text x="512" y="208" fill="#f5f7fa">Plus</text>
    <text x="620" y="208" fill="#f5f7fa">72%</text>
    <text x="768" y="208" fill="#f5f7fa">Aug 20, 11:40</text>
    <text x="970" y="208" fill="#43d17c">LIVE</text>
    <text x="72" y="248" fill="#f5f7fa">work</text>
    <text x="230" y="248" fill="#f5f7fa">work@example.com</text>
    <text x="512" y="248" fill="#f5f7fa">Pro</text>
    <text x="620" y="248" fill="#f5f7fa">100%</text>
    <text x="768" y="248" fill="#f5f7fa">Not started</text>
    <text x="970" y="248" fill="#43d17c">LIVE</text>
    <text x="34" y="314" fill="#46c9d6" font-weight="700">↑/↓</text>
    <text x="82" y="314" fill="#8f9aa6">Move</text>
    <text x="168" y="314" fill="#46c9d6" font-weight="700">Enter</text>
    <text x="234" y="314" fill="#8f9aa6">Select</text>
    <text x="330" y="314" fill="#46c9d6" font-weight="700">R</text>
    <text x="354" y="314" fill="#8f9aa6">Refresh</text>
    <text x="466" y="314" fill="#46c9d6" font-weight="700">Q</text>
    <text x="490" y="314" fill="#8f9aa6">Quit</text>
  </g>
</svg>
